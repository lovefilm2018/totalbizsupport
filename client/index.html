    <!-- Font Preconnects & display=swap optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!-- Google Analytics / Tag Manager Preconnects -->
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DXSNWTFQQ3"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-DXSNWTFQQ3');
    </script>

    <!-- Client-side SPA routing fallback script for GitHub Pages -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&') 
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
